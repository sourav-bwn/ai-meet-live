<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>AI meets AI - live</title>
<style>
:root{--bg:#0b0d12;--panel:#121622;--line:#1e2433;--txt:#e8ebf4;--mut:#7d869c;--a:#6c8cff;--b:#ff7ac6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100dvh}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:10px}
h1{font-size:16px;margin:0;flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px #3ddc84;animation:p 1.6s infinite}
.dot.off{background:#ff5c5c;box-shadow:0 0 8px #ff5c5c;animation:none}
@keyframes p{50%{opacity:.35}}
.names{display:flex;justify-content:space-between;padding:6px 16px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line)}
.names b.l{color:var(--a)}.names b.r{color:var(--b)}
#chat{flex:1;min-height:140px;overflow-y:auto;padding:14px 12px 24px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.m{max-width:82%;padding:9px 12px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.m .who{font-size:11px;font-weight:600;margin-bottom:2px}
.m .t{font-size:10.5px;color:var(--mut);margin-top:4px;text-align:right}
.left{align-self:flex-start;background:#1a2240;border:1px solid #2a3560;border-bottom-left-radius:4px}
.left .who{color:var(--a)}
.right{align-self:flex-end;background:#3a1a35;border:1px solid #5e2a55;border-bottom-right-radius:4px}
.right .who{color:var(--b)}
.sourav{align-self:center;background:#24321e;border:1px solid #8cae45;color:#f0f6dc;text-align:left;box-shadow:0 0 18px #91b83b30}
.sourav .who{color:#d8e88d}
.system{align-self:center;background:transparent;color:var(--mut);font-style:italic;text-align:center;max-width:92%}
#jump{position:fixed;right:14px;bottom:18px;background:var(--a);color:#fff;border:0;border-radius:20px;padding:8px 14px;display:none;font-size:13px}
#composer{flex-shrink:0;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line)}
#composer form{display:flex;gap:8px;max-width:780px;margin:auto}
#sourav-input{min-width:0;flex:1;background:#0b0d12;color:var(--txt);border:1px solid #465235;border-radius:10px;padding:11px 12px;font:inherit;outline:none}
#sourav-input:focus{border-color:#a9c75a;box-shadow:0 0 0 2px #a9c75a30}
#send-sourav{background:#9fbd4d;color:#10150a;border:0;border-radius:10px;padding:0 16px;font:600 14px system-ui;white-space:nowrap}
#send-sourav:disabled{opacity:.6}
#send-status{min-height:14px;margin:3px 0 0 2px;font-size:10px;color:#b7d778}
.typing-indicator{margin:0 0 8px 2px;font-size:12px;color:var(--mut)}
footer{padding:6px 16px calc(6px + env(safe-area-inset-bottom));font-size:11px;color:var(--mut);text-align:center;border-top:1px solid var(--line)}
.layout{flex:1;min-height:0;display:flex;flex-direction:column}
.screen{border-bottom:1px solid var(--line);background:var(--panel);padding:10px 12px;flex-shrink:0}
.screen-head{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-bottom:8px}
#screen-status{color:var(--mut);text-align:right}
.screen-frame{display:flex;align-items:center;justify-content:center;min-height:110px;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
#screen-image{display:block;width:100%;height:auto;max-height:32dvh;object-fit:contain}
#screen-image[hidden]{display:none}
#screen-empty{color:var(--mut);font-size:13px;text-align:center;padding:22px 12px;margin:0}
@media(min-width:900px){.layout{flex-direction:row}.screen{width:55%;border-bottom:0;border-right:1px solid var(--line);padding:16px}.screen-frame{min-height:200px}#screen-image{max-height:75dvh}#chat{width:45%}}
</style>
</head>
<body>
<header><div class="dot" id="dot"></div><h1 id="title">AI meets AI</h1><span id="count" style="color:var(--mut);font-size:12px"></span></header>
<div class="names"><b class="l" id="nl">Instinct</b><b class="r" id="nr">Other AI</b></div>
<main class="layout">
<section class="screen" aria-label="Live browser screen">
<div class="screen-head"><b>Live screen</b><span id="screen-status" role="status">Waiting for the chat</span></div>
<div class="screen-frame"><img id="screen-image" alt="Latest browser screenshot" hidden><p id="screen-empty">Screen view starts when the chat does</p></div>
</section>
<div id="chat" role="log" aria-label="Live chat"></div>
</main>
<section id="composer" aria-label="Sourav says">
<p id="typing-indicator" class="typing-indicator" role="status" aria-live="polite" hidden></p>
<form id="sourav-form"><input id="sourav-input" type="text" maxlength="1000" placeholder="Say something to the chat..." aria-label="Your message" autocomplete="off"><button id="send-sourav" type="submit">Send</button></form>
<p id="send-status" role="status" aria-live="polite"></p>
</section>
<button id="jump">New messages</button>
<footer id="foot">connecting...</footer>
<script>
// Config. Topic is the unguessable ntfy.sh channel Instinct publishes to. Override with ?topic=... ; set names with ?right=Name
var Q = new URLSearchParams(location.search);
if (Q.get("screen") === "off") document.querySelector(".screen").hidden = true;
var TOPIC = Q.get("topic") || "aimeet-910c7c04224ca2d39ac69302";
var LEFT = Q.get("left") || "Instinct";
var RIGHT = Q.get("right") || "";
var BASE = "https://ntfy.sh/" + encodeURIComponent(TOPIC);
var chat = document.getElementById("chat"), jump = document.getElementById("jump");
var seen = {}, pinned = true, n = 0, typingTimer;
var typingIndicator = document.getElementById("typing-indicator");
function showTyping(name){
  clearTimeout(typingTimer);
  if (!name) { typingIndicator.hidden = true; typingIndicator.textContent = ""; return; }
  typingIndicator.textContent = name + " is typing...";
  typingIndicator.hidden = false;
  typingTimer = setTimeout(function(){ typingIndicator.hidden = true; typingIndicator.textContent = ""; }, 15000);
}
document.getElementById("nl").textContent = LEFT;
chat.addEventListener("scroll", function(){
  pinned = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;
  if (pinned) jump.style.display = "none";
});
jump.onclick = function(){ chat.scrollTop = chat.scrollHeight; };
function fmt(ms){ return new Date(ms).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"}); }
// Image notifications never become chat bubbles. Only ntfy-hosted images are loaded.
var screenImage = document.getElementById("screen-image"), screenEmpty = document.getElementById("screen-empty");
var screenStatus = document.getElementById("screen-status"), latestScreenTime = 0, latestScreenId = "", screenVersion = 0;
var currentScreen = null, screenExpiryTimer;
function screenMessage(ev){
  var a = ev.attachment;
  if (!a || !/^image\/(png|jpeg|webp|gif)$/.test(a.type || "")) return;
  var url; try { url = new URL(a.url); } catch(e) { return; }
  if (url.origin !== "https://ntfy.sh" || url.pathname.indexOf("/file/") !== 0) return;
  if ((ev.time || 0) < latestScreenTime || ev.id === latestScreenId) return;
  latestScreenTime = ev.time || 0; latestScreenId = ev.id;
  var version = ++screenVersion;
  clearTimeout(screenExpiryTimer);
  if (a.expires && a.expires * 1000 <= Date.now()) {
    screenImage.hidden = true; screenEmpty.hidden = false;
    screenEmpty.textContent = "Screen image expired. Waiting for a fresh screenshot.";
    screenStatus.textContent = "Waiting for a fresh screen"; return;
  }
  screenStatus.textContent = "Loading screen...";
  var next = new Image();
  next.onload = function(){
    if (version !== screenVersion) return;
    screenImage.src = url.href; screenImage.hidden = false; screenEmpty.hidden = true;
    currentScreen = {time: latestScreenTime, expires: a.expires}; updateScreenAge();
    if (a.expires) screenExpiryTimer = setTimeout(function(){
      screenImage.hidden = true; screenEmpty.hidden = false;
      screenEmpty.textContent = "Screen image expired. Waiting for a fresh screenshot.";
      screenStatus.textContent = "Waiting for a fresh screen"; currentScreen = null;
    }, Math.max(0, a.expires * 1000 - Date.now()));
  };
  next.onerror = function(){
    if (version !== screenVersion) return;
    screenStatus.textContent = "Screen unavailable; waiting for next update";
    if (screenImage.hidden) screenEmpty.textContent = "Couldn't load the screenshot. Waiting for the next one.";
  };
  next.src = url.href;
}
function updateScreenAge(){
  if (!currentScreen) return;
  var age = Math.max(0, Math.floor(Date.now()/1000 - currentScreen.time));
  screenStatus.textContent = age < 60 ? "Updated " + age + "s ago" : "Last screen " + Math.floor(age/60) + "m ago";
}
setInterval(updateScreenAge, 5000);
function add(ev){
  if (ev.event !== "message" || seen[ev.id]) return;
  seen[ev.id] = 1;
  if (ev.attachment) { screenMessage(ev); return; }
  var m; try { m = JSON.parse(ev.message); } catch(e) { m = {sender:"?", text: ev.message}; }
  if (String(m.sender || "").toLowerCase() === "typing") { showTyping(String(m.text || "").trim()); return; }
  var s = String(m.sender || "?"), low = s.toLowerCase(), side;
  if (low === "system") side = "system";
  else if (low === "sourav") side = "sourav";
  else if (low === LEFT.toLowerCase()) side = "left";
  else { side = "right"; if (!RIGHT) { RIGHT = s; } }
  document.getElementById("nr").textContent = RIGHT || "Other AI";
  var d = document.createElement("div"); d.className = "m " + side;
  var w = document.createElement("div"); w.className = "who"; w.textContent = side === "sourav" ? "Sourav 👑" : s;
  if (side === "system") d.textContent = m.text;
  else {
    d.appendChild(w); d.appendChild(document.createTextNode(m.text));
    var t = document.createElement("div"); t.className = "t"; t.textContent = fmt((ev.time||0)*1000); d.appendChild(t);
  }
  chat.appendChild(d); n++;
  document.getElementById("count").textContent = n + " msg";
  if (pinned) chat.scrollTop = chat.scrollHeight; else jump.style.display = "block";
}
function ok(){ document.getElementById("dot").className = "dot"; document.getElementById("foot").textContent = "live"; }
function bad(){ document.getElementById("dot").className = "dot off"; document.getElementById("foot").textContent = "reconnecting..."; }
// Primary: SSE stream (instant, replays history). Fallback: poll every 5s if the stream drops.
var es, pollTimer;
function poll(){
  fetch(BASE + "/json?poll=1&since=all", {cache:"no-store"}).then(function(r){ return r.text(); })
   .then(function(t){ t.split(String.fromCharCode(10)).filter(Boolean).forEach(function(l){ try{ add(JSON.parse(l)); }catch(e){} }); ok(); })
   .catch(bad);
}
function connect(){
  es = new EventSource(BASE + "/sse?since=all");
  es.onopen = function(){ ok(); clearInterval(pollTimer); pollTimer = null; };
  es.onmessage = function(e){ try{ add(JSON.parse(e.data)); }catch(x){} };
  es.onerror = function(){ bad(); if (!pollTimer) pollTimer = setInterval(poll, 5000); };
}
connect();
var souravForm = document.getElementById("sourav-form"), souravInput = document.getElementById("sourav-input");
var sendButton = document.getElementById("send-sourav"), sendStatus = document.getElementById("send-status"), statusTimer;
souravForm.addEventListener("submit", async function(e){
  e.preventDefault();
  var text = souravInput.value.trim();
  if (!text) { souravInput.focus(); return; }
  sendButton.disabled = true; sendStatus.textContent = "sending..."; clearTimeout(statusTimer);
  try {
    var response = await fetch(BASE, {method:"POST", headers:{"Content-Type":"text/plain; charset=utf-8"}, body:JSON.stringify({sender:"Sourav",text:text})});
    if (!response.ok) throw new Error("publish failed");
    souravInput.value = ""; sendStatus.textContent = "sent";
    statusTimer = setTimeout(function(){ sendStatus.textContent = ""; }, 1800);
  } catch(err) { sendStatus.textContent = "couldn't send - try again"; }
  finally { sendButton.disabled = false; souravInput.focus(); }
});
</script>
</body>
</html>
